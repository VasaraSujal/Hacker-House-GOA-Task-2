services:
  - type: web
    name: hh-goa-voice-rag-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile.free
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: WEB_CONCURRENCY
        value: "1"
      - key: RETRIEVAL_MODE
        value: cloud_dense_sparse
      - key: ANSWER_MODE
        value: extractive
      - key: CORS_ORIGINS
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: hh_goa_voice_rag_prod
      - key: QDRANT_INFERENCE_MODEL
        value: intfloat/multilingual-e5-small
      - key: QDRANT_INFERENCE_DIMENSION
        value: "384"
      - key: QDRANT_TIMEOUT_S
        value: "30"
      - key: BM25_INDEX_PATH
        value: /app/data/indexes/bm25.pkl
      - key: ENABLE_RERANKER
        value: "false"
      - key: MAX_AUDIO_SIZE_MB
        value: "20"
      - key: VOICE_RATE_LIMIT_PER_MINUTE
        value: "20"
